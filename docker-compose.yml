name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    stop_grace_period: 10s
    command:
      - server
      - /data
      - --console-address
      - ':${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    ports:
      - '${MINIO_API_PORT:?MINIO_API_PORT is required}:9000'
      - '${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}:9001'
    volumes:
      - minio_data:/data
    networks:
      - data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    restart: 'on-failure:${MINIO_INIT_MAX_RETRIES:?MINIO_INIT_MAX_RETRIES is required}'
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      MINIO_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      MINIO_BUCKET_ACCESS: ${MINIO_BUCKET_ACCESS:?MINIO_BUCKET_ACCESS is required}
      MINIO_INIT_RETRY_INTERVAL: 2
      MINIO_INIT_MAX_RETRIES: 5
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        attempt=0
        until /usr/bin/mc alias set local "http://minio:9000" "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          attempt=$$((attempt + 1))
          if [ "$${attempt}" -ge "$${MINIO_INIT_MAX_RETRIES}" ]; then
            echo "MinIO did not become ready after $${MINIO_INIT_MAX_RETRIES} attempts" >&2
            exit 1
          fi
          sleep "$${MINIO_INIT_RETRY_INTERVAL}"
        done
        /usr/bin/mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        /usr/bin/mc anonymous set "$${MINIO_BUCKET_ACCESS}" "local/$${MINIO_BUCKET}"
    networks:
      - data

networks:
  data:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
